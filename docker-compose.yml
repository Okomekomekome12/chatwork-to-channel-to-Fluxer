services:
  bridge:
    image: python:3.12-slim
    container_name: cw_fluxer_bridge
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      - PORT=3140
      - PYTHONUNBUFFERED=1
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python index.py"
    restart: unless-stopped
    # ( caddy  cw_fluxer_bridge:3140 )
    # caddy  docker network connect (README )
