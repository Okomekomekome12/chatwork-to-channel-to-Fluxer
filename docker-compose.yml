services:
  bridge:
    image: python:3.12-slim
    container_name: cw_fluxer_bridge
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      - PORT=3140
      - PYTHONUNBUFFERED=1
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python index.py"
    restart: unless-stopped
    # ポートは公開しない(既存の caddy から cw_fluxer_bridge:3140 で届く)
    # caddy との接続は docker network connect で行う(README の手順参照)